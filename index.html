<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takari Canal Tracker</title>
<meta name="description" content="Live open and closed status of Takari canal distributaries on a satellite map, with days-open summary.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* Layout idea: a field instrument. Thin header with live count, three views
   (network map, canal list, days-open summary), one bottom sheet for a canal. */
:root{
  --paper:#f3f5f2; --panel:#ffffff; --ink:#15262b; --muted:#5d6f72; --rule:#d6ddd9;
  --water:#0b6fc2; --water-soft:#dcecf9; --idle:#9aa7a6; --warn:#a15c00; --warn-soft:#fbefd9;
  --danger:#b3261e; --focus:#0b6fc2;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1a1d; --panel:#16262a; --ink:#e6eeec; --muted:#93a6a6; --rule:#2a3d41;
    --water:#4fb0ff; --water-soft:#12344f; --idle:#566a6c; --warn:#f0b354; --warn-soft:#3a2c10;
    --danger:#ff8a80; --focus:#4fb0ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1a1d; --panel:#16262a; --ink:#e6eeec; --muted:#93a6a6; --rule:#2a3d41;
  --water:#4fb0ff; --water-soft:#12344f; --idle:#566a6c; --warn:#f0b354; --warn-soft:#3a2c10;
  --danger:#ff8a80; --focus:#4fb0ff; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;padding:16px 0 12px}
h1{font:700 26px/1.05 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.hgrow{flex:1 1 220px;min-width:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:4px 10px;background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.live.on .dot{background:var(--water)}
.live.bad .dot{background:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-width:0}
.stat b{display:block;font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.water b{color:var(--water)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:12px}
nav a{flex:1;text-align:center;padding:10px 6px;text-decoration:none;color:var(--muted);font:600 16px var(--display);letter-spacing:.03em;text-transform:uppercase;border-bottom:3px solid transparent;margin-bottom:-1px}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--water)}
.view{display:none}
.view.on{display:block}
.note{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);padding:8px 12px;border-radius:4px;font-size:13px;margin-bottom:12px}
.note[hidden]{display:none}

/* map */
.mapbox{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden;height:clamp(340px,64vh,640px)}
#map{width:100%;height:100%;background:#0b1518}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);font:600 18px var(--display);cursor:pointer}
.legend{position:absolute;left:8px;bottom:8px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid var(--idle);vertical-align:middle;margin-right:6px}
.legend i.o{border-top:4px solid var(--water)}
.legend i.p{border-top:2px dashed var(--idle)}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}

/* list */
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.tools input[type=search],.tools select,.tools input[type=date]{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:9px 12px;min-width:0}
.tools input[type=search]{flex:1 1 180px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grp{font:600 14px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;display:flex;justify-content:space-between;gap:8px}
.rows{background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:10px 12px;cursor:pointer;min-height:52px;border-left:4px solid transparent}
.row:first-child{border-top:0}
.row.open{border-left-color:var(--water);background:var(--water-soft)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .nm small{color:var(--muted);font-size:12px}
.pill{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.open{background:var(--water);border-color:var(--water);color:#fff}
.pill.na{border-style:dashed}
.empty{color:var(--muted);padding:24px 12px;text-align:center}

/* summary */
.tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:9px 12px;border-top:1px solid var(--rule);text-align:left;vertical-align:middle}
thead th{border-top:0;font:600 13px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .lnk{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:600;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px;overflow-wrap:anywhere}
.bar{position:relative;height:12px;min-width:120px;background:var(--paper);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.bar span{position:absolute;top:0;bottom:0;background:var(--water);min-width:2px}
.runs{min-width:140px}
.runs div{font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums}
.runs span{white-space:nowrap}
.runs div+div{margin-top:4px}
.runs .runon{color:var(--water);font-weight:600}
tbody td:first-child{position:sticky;left:0;background:var(--panel);z-index:1;min-width:92px}
#v-summary table{min-width:0}
#v-summary th,#v-summary td{padding:9px 6px}
#v-summary td.dhm{white-space:normal;min-width:84px;line-height:1.35}
.dhm span,#m-days span{white-space:nowrap;display:block}
#m-days{font-size:22px;line-height:1.2}
.dd{display:block;color:var(--muted);font-size:12px;margin-top:2px}
#v-summary th:first-child,#v-summary td:first-child{padding-left:10px}
.axis{display:flex;justify-content:space-between;gap:16px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--water);border-color:var(--water);color:#fff}
.btn.stop{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.dng{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.cap{color:var(--muted);font-size:13px;margin:8px 0 0;max-width:65ch}
textarea{width:100%;height:120px;margin-top:8px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:8px;font:12px ui-monospace,Menlo,monospace;padding:8px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.scrim.on{display:flex}
.sheet{background:var(--panel);color:var(--ink);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px 24px;border:1px solid var(--rule);border-bottom:0}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px;border-bottom:1px solid var(--rule)}}
.sheet h2{font:700 22px/1.15 var(--display);margin:0;overflow-wrap:anywhere}
.shead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.x{flex:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--rule);background:none;cursor:pointer;font-size:18px}
.now{margin:12px 0;padding:12px;border-radius:8px;border:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.now.open{background:var(--water-soft);border-color:var(--water)}
.now strong{font:600 18px var(--display)}
.now .btn{min-width:130px;min-height:44px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:12px 0;font-size:14px}
dt{color:var(--muted)}
dd{margin:0;overflow-wrap:anywhere}
details{border-top:1px solid var(--rule);padding:10px 0}
summary{cursor:pointer;font-weight:600}
.form{display:grid;gap:10px;margin-top:10px}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 10px;color:var(--ink);min-width:0;width:100%}
.sat{color:var(--water);font-weight:600}
.err{color:var(--danger);font-size:13px;min-height:1em}
.hist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.hist li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:14px}
.hist small{color:var(--muted);display:block}
.hist .btn{padding:6px 10px;font-size:13px}
@media(max-width:420px){h1{font-size:22px}.stat b{font-size:20px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* standalone site additions */
.hbtn{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.legend{position:static;flex-direction:row;flex-wrap:wrap;gap:4px 18px;margin-top:8px}
.legend i{border-top:3px solid #fff;box-shadow:0 0 0 1.5px #001018}
.legend i.o{border-top:4px solid #38b8ff}
.legend i.p{border-top:2px dashed #cfd6d6;box-shadow:none;background:#001018}
.ctip{background:rgba(0,16,24,.82);color:#fff;border:0;border-radius:4px;padding:1px 6px;font:600 12px var(--display);box-shadow:none}
.ctip:before{display:none}
.locbtn{width:34px;height:34px;border-radius:4px;border:2px solid rgba(0,0,0,.2);background:#fff;color:#111;font-size:18px;cursor:pointer;line-height:1}
.mbtns{display:flex;flex-direction:column;gap:6px}
.mbtn{min-width:34px;height:34px;padding:0 9px;border-radius:4px;border:2px solid rgba(0,0,0,.2);background:#fff;color:#111;font:600 12px var(--body);cursor:pointer;white-space:nowrap}
.mbtn[aria-pressed="true"]{background:#111;color:#fff}
/* summary report */
.sumbar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;margin-bottom:6px}
.fld{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.fld select,.fld input{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:9px 12px;font-size:15px;min-width:0}
.fld select{min-width:210px}
.dates{display:flex;gap:10px}.dates[hidden]{display:none}
.sumact{display:flex;gap:8px;margin-left:auto;align-items:flex-end}
.dl{position:relative;border:0;padding:0}
.dl summary{list-style:none}.dl summary::-webkit-details-marker{display:none}
.dl summary::after{content:"";display:inline-block;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin:0 0 3px 8px}
.dl .menu{position:absolute;right:0;top:calc(100% + 4px);z-index:5;background:var(--panel);border:1px solid var(--rule);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:4px;min-width:220px;display:grid}
.dl .menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer}
.dl .menu button:hover{background:var(--paper)}
.copymsg{margin:0;min-height:0}
.ptitle{margin:14px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
.ptitle h2{font:700 24px/1.15 var(--display);margin:0}
.ptitle p{margin:2px 0 0;color:var(--muted);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--rule);border-radius:8px;background:var(--panel);margin-bottom:6px}
.kpi{padding:12px 14px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--rule)}
.kpi b{display:block;font:600 24px/1.15 var(--display);font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
@media(max-width:480px){.kpi{padding:10px}.kpi b{font-size:18px}.sumact{margin-left:0}.tlaxis,.tlrow{grid-template-columns:minmax(64px,24%) 1fr}}
.sh{font:600 13px var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.shrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.linkbtn{background:none;border:0;padding:0;color:var(--water);font:500 13px var(--body);text-transform:none;letter-spacing:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
table.rpt{min-width:0;width:100%}
.rpt th,.rpt td{padding:9px 10px}
.rpt th{font:600 12px var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rpt td.n,.rpt th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rpt tbody td:first-child{position:static;min-width:0}
.rpt tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
.rpt tr.none td{color:var(--muted)}
.rpt .sys{background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
/* timeline: one row per canal that ran, a bar for each opening */
.tlwrap{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:8px 12px 10px}
.tlaxis,.tlrow{display:grid;grid-template-columns:minmax(70px,26%) 1fr;gap:10px;align-items:center}
.tlaxis .tlt{position:relative;height:18px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tlaxis .tlt span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.tlaxis .tlt span.l{transform:none}
.tlsys{font-size:11px;font-weight:600;color:var(--muted);margin:8px 0 2px;letter-spacing:.03em}
.tln{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlbar{position:relative;height:20px;border-left:1px solid var(--rule);background:repeating-linear-gradient(90deg,transparent 0,transparent calc(var(--tick) - 1px),var(--rule) calc(var(--tick) - 1px),var(--rule) var(--tick))}
.tlb{position:absolute;top:5px;height:10px;min-width:4px;border:0;padding:0;border-radius:4px;background:var(--water);cursor:pointer;box-shadow:0 0 0 1px var(--panel)}
.tlb::after{content:"";position:absolute;inset:-7px 0}
.tlb.on{background:repeating-linear-gradient(135deg,var(--water) 0 5px,var(--water-soft) 5px 7px)}
.tlb:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.tltip{min-height:1.4em;margin:6px 0 0;font-size:12px}
/* canal details */
.dsys{margin-top:10px}
.dhead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 2px;cursor:pointer;text-align:left;color:var(--ink)}
.dhead .gname{flex:1;font:600 17px var(--display)}
.dhead .gsum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.dsys .tblwrap{margin-top:8px}
.rx{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.rx .chev{width:7px;height:7px}
.rx b{font-weight:600}
.rx small{display:block;color:var(--muted);font-size:12px;font-weight:400}
tr.open-now td:first-child{box-shadow:inset 3px 0 0 var(--water)}
tr.runsrow td{background:var(--paper);padding:6px 10px 10px 30px;border-top:0}
.runlist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.runlist li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px}
.rsub{display:block;font-size:12px;color:var(--muted);font-weight:400}
.rpt td.n{vertical-align:top}
.rpt.fixed{table-layout:fixed}.rpt.fixed .c1{width:auto}.rpt.fixed .c2{width:22%}.rpt.fixed .c3{width:34%}
@media(min-width:700px){.rpt.fixed .c2{width:18%}.rpt.fixed .c3{width:24%}}
.rx span{min-width:0;overflow-wrap:anywhere}
.runlist .rnow{color:var(--water);font-weight:600}
.foot{font-size:12px;margin-top:16px}
.printhead{display:none}
@media print{
  body{background:#fff;color:#000;font-size:12px}
  .wrap{max-width:none;padding:0}
  header,.wrap>.stats,nav,#note,.noprint,.sumbar,.scrim,.view:not(#v-summary),.ptitle,#tltip,.rx .chev,.dhead .chev{display:none!important}
  #v-summary{display:block!important}
  .printhead{display:block;margin:0 0 10px}
  .printhead h1{font-size:20px;margin:0 0 2px}
  .dhead,.tlrow,tr{break-inside:avoid}
  .dhead,.sh{break-after:avoid}
  .dl .menu{display:none}
  .tblwrap{overflow:visible}
  tbody td:first-child{position:static}
  .tlb,.kpis{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.lines-off .leaflet-overlay-pane,.lines-off .leaflet-tooltip-pane{display:none}
.scrim{z-index:2000}
.acts{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:8px 0}
/* canals tab: tap a system to see its DYs, tap "Show" on a DY to see its minors */
.ghead{display:flex;align-items:center;gap:12px;width:100%;margin:10px 0 0;padding:12px 14px;min-height:60px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;cursor:pointer;text-align:left}
.ghead[aria-expanded="true"]{border-radius:8px 8px 0 0}
.ghead,.ghead:disabled{color:var(--ink)}
.ghead[aria-expanded="true"]+.rows{border-radius:0 0 8px 8px;border-top:0}
.ghead:disabled{cursor:default}
.ghead .gname{flex:1;min-width:0;font:700 19px/1.15 var(--display);letter-spacing:.01em}
.ghead .gcount{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.ghead.live .gcount{color:var(--water);font-weight:600}
.chev{flex:none;width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin:0 3px;transition:transform .15s}
[aria-expanded="true"]>.chev{transform:rotate(45deg)}
.row{cursor:default;gap:8px;padding-top:0;padding-bottom:0}
.rmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:10px 0;min-height:52px;text-align:left;cursor:pointer;color:inherit}
.rexp{flex:none;align-self:center;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 10px;min-height:36px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.rexp .chev{width:7px;height:7px;margin:0 2px}
.rexp.live{color:var(--water);border-color:var(--water)}
/* map tools */
#mform{margin-bottom:6px}
#mform select{flex:0 1 220px}
.mcount{margin:0 0 8px;min-height:1.2em}
.mcount.miss{color:var(--danger)}
.ctip.dim{background:rgba(0,16,24,.62);font-weight:500;font-size:11px}
.ctip.hl{background:#ffd400;color:#111}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hgrow">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
"use strict";
/* ---------- canal catalogue ---------- */
/* Five systems. The KMZ pipe pieces named "Mr 5", "SMr 1", "Sub Main 2", "450MM RCC" ... all join
   "Sonsal and Shirasgaon PDN from Stage 4" next to Sonsal LBC, so they belong to Sonsal.
   DY-50/53/55 pipelines and the bare "Minor-3", "Sub Minor-1" ... lie on the main canal. */
function groupOf(c){
  const n=c.name;
  if(/Dudhari/i.test(n)) return "Takari-Dudhari Pipeline";
  if(/Sonsal/i.test(n)||/^(S?Mr|M) ?\d|^Sub Main|^Main Canal \d|^\d+MM/i.test(n)) return "Sonsal Left Bank Canal";
  if(/Mohite/i.test(n)) return "Mohite-Vadgaon Vitarika";
  if(/Chinchani/i.test(n)) return "Chinchani Feeder Canal";
  return "Takari Main Canal";
}
const GORDER=["Takari Main Canal","Sonsal Left Bank Canal","Mohite-Vadgaon Vitarika","Takari-Dudhari Pipeline","Chinchani Feeder Canal"];
/* Where each canal sits in its system: a path like ["DY-2","Minor-9R","Sub Minor-1L"].
   The KMZ spells DYs many ways (DY-41, DY- 41, DY36, D.Y-83, Dy 52 A, D.Y.No. 5) and sometimes
   writes the parent last (Minor-1/DY-41); all are brought to one form here. */
const DYRE=/[Dd]\.?\s?[Yy]\.?\s?(?:No\.?)?\s?-?\s?(\d+)(?:\s?([A-D])(?![A-Za-z]))?/;
/* Canals the KMZ names without their parent, placed by where they join on the map. */
const PLACE={"minor-1-1":"DY-91/Minor-1","minor-2":"DY-91/Minor-2","minor-3":"DY-91/Minor-3","minor-4":"DY-91/Minor-4","minor-5":"DY-91/Minor-5",
  "sub-minor-1":"DY-91/Minor-2/Sub Minor-1","sub-minor-2":"DY-91/Minor-2/Sub Minor-2",
  "minor-1-2":"DY-21/Minor-1","minor-1-3":"DY-49/Minor-1","distributry-no-18":"DY-18"};
/* Main-canal offtakes with no DY number, ordered by offtake chainage (Chikhali at 27,960 m, after DY-20). */
const AFTER={"chikhali-dy":20.5,"cusecs-canal":9998};
const PIPE=/^(S?Mr|M) ?\d|^Sub Main|^Main Canal \d|^\d+MM|Sonsal and Shirasgaon/i;
const TRUNK={"Takari Main Canal":"Takari Main Canal","Sonsal Left Bank Canal":"Sonsal LBC","Mohite-Vadgaon Vitarika":"Mohite-Vadgaon Vitarika",
  "Takari-Dudhari Pipeline":"Takari-Dudhari PDN","Chinchani Feeder Canal":"Chinchani-Ambak Feeder Canal"};
const PRE={"Sonsal Left Bank Canal":"Sonsal LBC/","Mohite-Vadgaon Vitarika":"Mohite-Vadgaon/","Chinchani Feeder Canal":"Chinchani/"};
const tidy=s=>s.trim().replace(/\s*-\s*/g,"-").replace(/\s+/g," ");
const rank=s=>/^DY-/.test(s)?0:/^Minor/i.test(s)?1:/^Sub Minor/i.test(s)?2:/^Lateral/i.test(s)?3:/^Sub Lateral/i.test(s)?4:5;
function placeOf(c,grp){
  const n=c.name; let p, dy=null, short=null, label=null, depth=null, rest=null;
  if(grp==="Sonsal Left Bank Canal"&&PIPE.test(n)){
    const main=/Sonsal and Shirasgaon/i.test(n), piece=tidy(n);
    short=main?"Sonsal-Shirasgaon PDN (Stage 4 rising main, 700MM MS)":piece; label=main?"Sonsal-Shirasgaon PDN":"Sonsal-Shirasgaon PDN/"+piece;
    return {dy:9000,letter:"",rest:main?"0":(/^Main Canal/i.test(n)?"1":/^Sub Main/i.test(n)?"2":/^Mr|^M /i.test(n)?"3":/^SMr/i.test(n)?"4":"5")+piece,short,label,depth:main?0:1};
  }
  if(grp==="Chinchani Feeder Canal"||grp==="Mohite-Vadgaon Vitarika"){
    const m=n.match(DYRE), sm=n.match(/Sub Minor No ?(\d+)/i);
    p=[]; if(grp==="Chinchani Feeder Canal"&&m) p.push("DY-"+m[1]); if(sm) p.push("Sub Minor-"+sm[1]);
    if(grp==="Mohite-Vadgaon Vitarika"&&p.length){ dy=0; depth=1; }
  }else if(grp==="Takari-Dudhari Pipeline") p=[];
  else if(PLACE[c.id]) p=PLACE[c.id].split("/");
  else{
    const s=n.replace(/^(Takari Main Canal|Sonsal LBC)\/?/,"").replace(/(\d)(Minor)/,"$1/$2");
    p=s.split("/").filter(x=>x.trim()).map(x=>{ const m=x.match(DYRE); return m&&/^\s*D/i.test(x)?"DY-"+m[1]+(m[2]||""):tidy(x); })
      .map((x,i)=>[x,i]).sort((a,b)=>rank(a[0])-rank(b[0])||a[1]-b[1]).map(x=>x[0]);
  }
  const d=p.length&&p[0].match(/^DY-(\d+)([A-D]?)$/);
  if(dy==null) dy=!p.length?-1:d?+d[1]:(AFTER[c.id]!=null?AFTER[c.id]:9999);
  short=p.length?p.join("/"):TRUNK[grp];
  label=p.length?(PRE[grp]||"")+short:short;
  return {dy,letter:d?d[2]:"",rest:d?p.slice(1).join("/"):p.join("/"),short,label,depth:depth!=null?depth:Math.max(0,p.length-1)};
}
const CANALS=window.CANALS_RAW.map(c=>{
  const dead=/cancel|cancled/i.test(c.remark||"")||c.status==="Proposed";
  const grp=groupOf(c), pl=placeOf(c,grp);
  return Object.assign({},c,{grp,dead,info:(window.DYINFO||{})[c.id]||null,k0:pl.dy,kl:pl.letter,k1:pl.rest,label:pl.label,short:pl.short,depth:pl.depth,
    w:/Main Canal|Feeder|Rising/.test(c.type||"")?3.2:(c.type==="Distributary"||c.type==="Major"||c.type==="Branch Distributary")?1.9:1.1});
}).sort((a,b)=>GORDER.indexOf(a.grp)-GORDER.indexOf(b.grp)||a.k0-b.k0||a.kl.localeCompare(b.kl)||a.k1.localeCompare(b.k1,undefined,{numeric:true})||(a.off||0)-(b.off||0));
/* the KMZ splits some canals into several lines with the same name: number them as parts */
{ const seen=new Map(); for(const c of CANALS) seen.set(c.label,(seen.get(c.label)||0)+1);
  const k=new Map(); for(const c of CANALS) if(seen.get(c.label)>1){ const i=(k.get(c.label)||0)+1; k.set(c.label,i); c.label+=" (part "+i+")"; c.short+=" (part "+i+")"; } }
/* tree: a canal's parent is the nearest canal above it in its system that is one level less indented */
{ const st=[]; let g=null;
  for(const c of CANALS){ if(c.grp!==g){ g=c.grp; st.length=0; }
    st.length=c.depth; c.parent=c.depth&&st[c.depth-1]||null; c.kids=[]; if(c.parent) c.parent.kids.push(c); st[c.depth]=c;
    c.leaf=c.short.split("/").pop(); } }
const below=c=>c.kids.flatMap(k=>[k,...below(k)]);
const BYID=new Map(CANALS.map(c=>[c.id,c]));
document.getElementById("ncanals").textContent=CANALS.length;

/* ---------- time maths (pure) ---------- */
const HOUR=3600e3, DAY=24*HOUR;
function cleanPeriods(raw){
  if(!Array.isArray(raw)) return [];
  return raw.filter(p=>p&&typeof p.s==="number"&&isFinite(p.s)&&(p.e==null||(typeof p.e==="number"&&p.e>=p.s)))
    .map(p=>({s:p.s,e:p.e==null?null:p.e,sb:typeof p.sb==="string"?p.sb:null,eb:typeof p.eb==="string"?p.eb:null}))
    .sort((a,b)=>a.s-b.s);
}
function openPeriod(ps){ for(let i=ps.length-1;i>=0;i--) if(ps[i].e==null) return ps[i]; return null; }
function calc(ps,a,b,now){
  const iv=[];
  for(const p of ps){ const s=Math.max(p.s,a), e=Math.min(p.e==null?now:p.e,b); if(e>s) iv.push([s,e]); }
  iv.sort((x,y)=>x[0]-y[0]);
  const m=[]; for(const x of iv){ const l=m[m.length-1]; if(l&&x[0]<=l[1]) l[1]=Math.max(l[1],x[1]); else m.push([x[0],x[1]]); }
  let ms=0;
  for(const [x,y] of m) ms+=y-x;
  return {ms,runs:iv.length,days:ms/DAY,iv:m};
}
function dur(ms){
  if(ms<HOUR) return Math.max(1,Math.round(ms/60e3))+" min";
  if(ms<2*DAY) return Math.round(ms/HOUR)+" h";
  return Math.floor(ms/DAY)+" d "+Math.round((ms%DAY)/HOUR)+" h";
}
const fmtDHM=ms=>{ const t=Math.round(ms/60e3), d=Math.floor(t/1440), h=Math.floor(t%1440/60), m=t%60;
  const pl=(n,w)=>n+" "+w+(n===1?"":"s"), out=[];
  if(d) out.push(pl(d,"day")); if(d||h) out.push(h+" hr"); out.push(m+" min"); return out; };
/* "19 days", "4 days 12 hr", "14 hr 30 min", "45 min" */
function fmtRun(ms){ const t=Math.round(ms/60e3), d=Math.floor(t/1440), h=Math.floor(t%1440/60), m=t%60;
  if(d) return d+(d===1?" day":" days")+(h?" "+h+" hr":"");
  if(h) return h+" hr"+(m?" "+m+" min":"");
  return Math.max(m,ms>0?1:0)+" min"; }
const fmtHM=fmtRun;
const htmlHM=ms=>{ const p=fmtDHM(ms); const d=/day/.test(p[0])?p.shift():""; return (d?'<span class="d">'+d+'</span>':"")+'<span>'+p.join(" ")+'</span>'; };
const fmtDays=d=>d>=1?d.toFixed(1):d.toFixed(2);
const fmtShort=t=>new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const fmtDT=t=>new Date(t).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const fmtD=t=>new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
function toLocalInput(t){ const d=new Date(t-new Date(t).getTimezoneOffset()*60e3); return d.toISOString().slice(0,16); }
function fromLocalInput(v){ if(!v) return null; const t=new Date(v).getTime(); return isFinite(t)?t:null; }
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

/* ---------- live state ---------- */
const S={periods:new Map(),db:null,user:null,auth:null,canWrite:false,loaded:false,online:false,busy:false,sel:null,filter:"all",showAll:false,names:{}};
const P=id=>S.periods.get(id)||[];
const $=id=>document.getElementById(id);
function setLive(cls,txt){ const el=$("live"); el.className="live "+cls; $("livetxt").textContent=txt; }
function setNote(t){ const n=$("note"); n.hidden=!t; n.textContent=t||""; }
function status(){
  if(!S.db) return;
  if(!S.loaded) return setLive("","Connecting");
  setLive(S.online?"on":"bad",S.online?"Live":"Offline");
  setNote(S.online?"":"You are offline. The status shown may be out of date.");
}
function connect(){
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||!cfg.databaseURL||!window.firebase){
    setLive("bad","Not set up"); $("authbtn").hidden=true;
    setNote("Live status is not connected yet. The site owner needs to add the Firebase settings in config.js (see README).");
    renderAll(); return;
  }
  let rdb;
  try{ firebase.initializeApp(cfg); rdb=firebase.database(); }
  catch(e){ setLive("bad","Setup error"); setNote("The Firebase settings in config.js are not valid."); renderAll(); return; }
  S.db=rdb;
  const timer=setTimeout(()=>{ if(!S.loaded){ setLive("bad","Waiting for data"); setNote("The live data can't be reached yet. Check your connection."); } },10000);
  rdb.ref("canals").on("value",snap=>{
    const v=snap.val()||{}, m=new Map();
    for(const id in v){ const ps=v[id]&&v[id].periods; m.set(id,cleanPeriods(ps&&typeof ps==="object"?Object.values(ps):[])); }
    S.periods=m; S.loaded=true; clearTimeout(timer); status(); renderAll();
  },()=>{ clearTimeout(timer); setLive("bad","No access"); setNote("Live data could not be read. Check that the database rules allow reading."); });
  rdb.ref(".info/connected").on("value",s=>{ S.online=!!s.val(); status(); });
  firebase.auth().onAuthStateChanged(u=>{ S.auth=u; S.canWrite=!!u; $("authbtn").textContent=u?"Sign out":"Staff sign in"; status(); renderAll(); });
}
async function savePeriods(id,ps){
  if(!S.db||S.busy) return "Not connected.";
  if(!S.auth) return "Sign in first.";
  S.busy=true; renderSheet();
  try{
    await S.db.ref("canals/"+id).set({periods:ps.map(p=>{const o={s:p.s}; if(p.e!=null)o.e=p.e; if(p.sb)o.sb=p.sb; if(p.eb)o.eb=p.eb; return o;}),name:BYID.get(id).name,updated:Date.now()});
    return "";
  }catch(e){
    if(e&&/PERMISSION_DENIED/i.test((e.code||"")+(e.message||""))) return "This account is not allowed to change canal status.";
    return "Could not save. Check your connection and try again.";
  }finally{ S.busy=false; renderAll(); }
}
async function myId(){ return S.auth?S.auth.uid:null; }

/* ---------- sign in ---------- */
$("authbtn").addEventListener("click",()=>{ if(S.auth){ firebase.auth().signOut(); return; } $("lerr").textContent=""; $("login").classList.add("on"); $("lemail").focus(); });
$("lclose").addEventListener("click",()=>$("login").classList.remove("on"));
$("lform").addEventListener("submit",async e=>{ e.preventDefault(); $("lgo").disabled=true; $("lerr").textContent="";
  try{ await firebase.auth().signInWithEmailAndPassword($("lemail").value.trim(),$("lpass").value); $("lpass").value=""; $("login").classList.remove("on"); }
  catch(err){ $("lerr").textContent=/network/i.test(err&&err.code||"")?"No connection. Try again.":"Wrong email or password."; }
  finally{ $("lgo").disabled=false; } });
/* ---------- header numbers ---------- */
function renderStats(){
  const now=Date.now(); let n=0,ica=0,last=0;
  for(const c of CANALS){ const ps=P(c.id); if(openPeriod(ps)){ n++; ica+=c.len||0; }
    for(const p of ps){ last=Math.max(last,p.s,p.e||0); } }
  $("s-open").textContent=n;
  $("s-ica").textContent=(ica/1000).toFixed(ica<1e5?1:0);
  $("s-last").textContent=last?dur(Math.max(0,now-last))+" ago":"\u2013";
}

/* ---------- list ---------- */
/* which systems and DYs are opened is remembered on this device */
const OPEN={g:new Set(),r:new Set()};
try{ const v=JSON.parse(localStorage.getItem("canalsOpen")||"null"); if(v){ (v.g||[]).forEach(x=>OPEN.g.add(x)); (v.r||[]).forEach(x=>OPEN.r.add(x)); } }catch(e){}
const saveOpen=()=>{ try{ localStorage.setItem("canalsOpen",JSON.stringify({g:[...OPEN.g],r:[...OPEN.r]})); }catch(e){} };
function rowHtml(c,flat,now){
  const op=openPeriod(P(c.id));
  const ica=c.info&&c.info.ica!=null?c.info.ica:c.ica;
  const meta=[c.type,ica?"ICA "+ica+" ha":"",c.info&&c.info.ch?"Ch "+c.info.ch:"",c.dead?(c.status==="Proposed"?"proposed":"cancelled"):""].filter(Boolean).join(" \u00b7 ");
  let x="";
  if(!flat&&c.kids.length){ const d=below(c), r=d.filter(k=>openPeriod(P(k.id))).length, ex=OPEN.r.has(c.id);
    x='<button type="button" class="rexp'+(r?" live":"")+'" data-x="'+esc(c.id)+'" aria-expanded="'+ex+'" aria-label="'+(ex?"Hide":"Show")+" the "+d.length+" canals under "+esc(c.short)+(r?", "+r+" running":"")+'">'
      +'<span class="chev" aria-hidden="true"></span>'+(ex?"Hide":"Show "+d.length)+(r?" \u00b7 "+r+" running":"")+'</button>'; }
  return '<div class="row'+(op?" open":"")+'" style="padding-left:'+(12+Math.min(c.depth,3)*16)+'px">'
    +'<button type="button" class="rmain" data-id="'+esc(c.id)+'"><span class="nm"><b>'+esc(flat?c.short:c.leaf)+'</b><small>'+esc(meta)+'</small></span>'
    +(op?'<span class="pill open">Running '+esc(dur(now-op.s))+'</span>':'<span class="pill'+(c.dead?" na":"")+'">Closed</span>')+'</button>'+x+'</div>';
}
function renderList(){
  const q=$("q").value.trim().toLowerCase(), now=Date.now(), flat=!!q||S.filter!=="all";
  const on=c=>!!openPeriod(P(c.id));
  const match=c=>(!q||[c.label,c.name,c.grp,c.remark].some(t=>(t||"").toLowerCase().includes(q)))&&(S.filter==="all"||(S.filter==="open")===on(c));
  let html="",found=0;
  for(const g of GORDER){
    const all=CANALS.filter(c=>c.grp===g), run=all.filter(on).length; let rows=null;
    if(flat){ rows=all.filter(match); if(!rows.length) continue; found+=rows.length; }
    const ex=flat||OPEN.g.has(g);
    html+='<button type="button" class="ghead'+(run?" live":"")+'" data-g="'+esc(g)+'" aria-expanded="'+ex+'"'+(flat?" disabled":"")+'>'
      +'<span class="chev" aria-hidden="true"></span><span class="gname">'+esc(g)+'</span>'
      +'<span class="gcount">'+(flat?rows.length+" found<br>":"")+run+" of "+all.length+" running</span></button>";
    if(!ex) continue;

/* Irrigation seasons: the day each one starts; a season ends when the next begins.
   Maharashtra irrigation seasons: Kharif 1 Jul - 14 Oct, Rabi 15 Oct - end Feb, Hot weather 1 Mar - 30 Jun. */
const SEASONS=[{name:"Kharif",m:7,d:1},{name:"Rabi",m:10,d:15},{name:"Hot weather",m:3,d:1}];
function seasonsAround(t){ const y=new Date(t).getFullYear(), L=[];
  for(let yr=y-3;yr<=y+1;yr++) for(const x of SEASONS) L.push({name:x.name,a:new Date(yr,x.m-1,x.d).getTime()});
  L.sort((p,q)=>p.a-q.a); for(let i=0;i<L.length-1;i++) L[i].b=L[i+1].a; return L.slice(0,-1); }
const seasonName=x=>{ const ya=new Date(x.a).getFullYear(), yb=new Date(x.b-1).getFullYear(); return x.name+" "+(ya===yb?ya:ya+"-"+String(yb).slice(2)); };
const monthName=d=>d.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
/* the period list: seasons first (the current one is the default), then recent days, then months */
function buildPeriods(){
  const now=Date.now(), L=seasonsAround(now), ci=L.findIndex(x=>x.a<=now&&now<x.b), m0=new Date(); m0.setDate(1); m0.setHours(0,0,0,0);
  let h='<optgroup label="Irrigation season">';
  for(let i=ci;i>=Math.max(0,ci-5);i--) h+='<option value="s:'+L[i].a+':'+L[i].b+'"'+(i===ci?" selected":"")+'>'+esc(seasonName(L[i]))+(i===ci?" (current)":"")+'</option>';
  h+='</optgroup><optgroup label="Recent"><option value="today">Today</option><option value="yesterday">Yesterday</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option></optgroup><optgroup label="Month">';
  for(let k=0;k<6;k++){ const d=new Date(m0); d.setMonth(d.getMonth()-k); const e=new Date(d); e.setMonth(e.getMonth()+1); h+='<option value="m:'+d.getTime()+':'+e.getTime()+'">'+esc(monthName(d))+(k===0?" (this month)":"")+'</option>'; }
  h+='</optgroup><option value="custom">Custom dates…</option>';
  $("rng").innerHTML=h;
}
buildPeriods();
function range(){
  const v=$("rng").value, sel=$("rng").selectedOptions[0], now=Date.now(), d0=new Date(); d0.setHours(0,0,0,0); const t0=d0.getTime(); let a,b=now,name="";
  if(/^[sm]:/.test(v)){ const p=v.split(":"); a=+p[1]; b=Math.min(+p[2],now); name=sel.textContent.replace(/ \((current|this month)\)$/,""); }
  else if(v==="today"){ a=t0; name="Today"; }
  else if(v==="yesterday"){ const d=new Date(t0); d.setDate(d.getDate()-1); a=d.getTime(); b=t0; name="Yesterday"; }
  else if(v==="custom"){
    a=$("d1").value?new Date($("d1").value+"T00:00").getTime():now-30*DAY;
    b=$("d2").value?new Date($("d2").value+"T00:00").getTime()+DAY:now;
    if(b>now&&now>a) b=now; if(b<=a) b=a+DAY; name="Custom period";
  } else { const d=new Date(t0); d.setDate(d.getDate()-(+v-1)); a=d.getTime(); name="Last "+v+" days"; }
  return [a,b,name];
}
const icaOf=c=>c.info&&c.info.ica!=null?c.info.ica:(c.ica||0);
const fmtHa=n=>Math.round(n).toLocaleString("en-IN");
const fmtDay=t=>new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});

let SUM=null;   // the last summary, used by the downloads and the printout
const unionMs=iv=>{ iv=iv.slice().sort((p,q)=>p[0]-q[0]); let ms=0,cur=null; for(const x of iv){ if(cur&&x[0]<=cur[1]) cur[1]=Math.max(cur[1],x[1]); else{ if(cur) ms+=cur[1]-cur[0]; cur=[x[0],x[1]]; } } if(cur) ms+=cur[1]-cur[0]; return ms; };
function summarise(){
  const [a,b,name]=range(), now=Date.now(), runs=new Map(), ran=new Set();
  for(const c of CANALS){ const r=calc(P(c.id),a,b,now); if(r.ms>0){ ran.add(c.id); runs.set(c.id,{r,list:P(c.id).filter(p=>p.s<b&&(p.e==null?now:p.e)>a)}); } }
  /* ICA counted once: a minor's ICA is part of its DY's, so skip a canal whose parent also ran */
  const top=c=>{ for(let p=c.parent;p;p=p.parent) if(ran.has(p.id)) return false; return true; };
  const sys=GORDER.map(g=>{ const rows=CANALS.filter(c=>c.grp===g&&(ran.has(c.id)||S.showAll)).map(c=>({c,...(runs.get(c.id)||{r:{ms:0,runs:0,iv:[]},list:[]})}));
    rows.sort((x,y)=>y.r.ms-x.r.ms);
    const rr=rows.filter(x=>x.r.ms>0), iv=rr.flatMap(x=>x.r.iv);

      ica:rr.filter(x=>top(x.c)).reduce((n,x)=>n+icaOf(x.c),0),hd:rr.filter(x=>top(x.c)).reduce((n,x)=>n+icaOf(x.c)*x.r.ms/DAY,0)}; });
  return {a,b,name,now,sys,ms:unionMs(sys.flatMap(x=>x.iv)),ran:ran.size,opens:sys.reduce((n,x)=>n+x.opens,0),ica:sys.reduce((n,x)=>n+x.ica,0),hd:sys.reduce((n,x)=>n+x.hd,0)};
}

/* ICA statement figures first; KMZ figures only where they differ */
const kmCh=m=>Math.floor(m/1000)+"/"+String(Math.round(m%1000)).padStart(3,"0");

});
$("scrim").addEventListener("click",e=>{ if(e.target===$("scrim")) closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&S.sel) closeSheet(); });
document.addEventListener("click",e=>{ const r=e.target.closest("[data-id]"); if(r&&!r.closest("#sheet")) openSheet(r.dataset.id); });

/* ---------- map (Leaflet, satellite) ---------- */
const V={fitted:false}; let map=null,bounds=null; const LY=new Map();
/* Zoom 19 is about 0.3 m a pixel here, zoom 20 about 0.15 m; beyond the sharpest photo the map only enlarges it. */
const MAXZ=21, SAFEZ=18;
/* Esri imagery that uses the sharpest photo each spot has. Above zoom 18, Esri's tilemap says which tiles
   exist; where one is missing the tile is cut from the nearest zoom that has a photo, so no grey
   "map data not yet available" squares appear. If the tilemap can't be read, zoom 18 photos are used. */
const EsriSharp=window.L&&L.TileLayer.extend({
  initialize(svc,opt){ this._svc=svc; this._tm=new Map(); L.TileLayer.prototype.initialize.call(this,svc+"/tile/{z}/{y}/{x}",Object.assign({maxZoom:MAXZ,maxNativeZoom:20},opt)); },
  _has(z,x,y){
    const r0=Math.floor(y/32)*32, c0=Math.floor(x/32)*32, k=z+"/"+r0+"/"+c0;
    if(!this._tm.has(k)) this._tm.set(k,fetch(this._svc+"/tilemap/"+z+"/"+r0+"/"+c0+"/32/32").then(r=>r.ok?r.json():null).catch(()=>null));
    return this._tm.get(k).then(j=>{ if(!j||!Array.isArray(j.data)) return false; const l=j.location||{left:c0,top:r0,width:32};
      const i=(y-l.top)*l.width+(x-l.left); return i>=0&&i<j.data.length&&!!j.data[i]; });
  },
  createTile(co,done){
    if(co.z<=SAFEZ) return L.TileLayer.prototype.createTile.call(this,co,done);
    const t=document.createElement("canvas"); t.width=t.height=256;
    const draw=z=>{ const f=2**(co.z-z), x=Math.floor(co.x/f), y=Math.floor(co.y/f), im=new Image();
      im.onload=()=>{ const s=256/f, cx=t.getContext("2d"); cx.imageSmoothingQuality="high"; cx.drawImage(im,(co.x-x*f)*s,(co.y-y*f)*s,s,s,0,0,256,256); done(null,t); };
      im.onerror=()=>done(new Error("tile"),t); im.src=L.Util.template(this._url,{z,x,y}); };
    const step=z=>{ if(z<=SAFEZ) return draw(SAFEZ); const f=2**(co.z-z); this._has(z,Math.floor(co.x/f),Math.floor(co.y/f)).then(ok=>ok?draw(z):step(z-1)); };
    step(co.z); return t;
  }
});
function initMap(){
  if(!window.L){ $("map").innerHTML='<p class="empty">The map could not load. Check your connection and reload the page.</p>'; return; }
  map=L.map("map",{preferCanvas:true,maxZoom:MAXZ});
  map.createPane("names"); map.getPane("names").style.zIndex=450; map.getPane("names").style.pointerEvents="none";
  const ESRI="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer";
  const CLARITY="https://clarity.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer";
  const credit="Imagery &copy; Esri, Maxar, Earthstar Geographics";
  const nameLayer=()=>L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",{maxZoom:MAXZ,maxNativeZoom:16,pane:"names",attribution:"Place names &copy; Esri"});
  const BASES={
    "Satellite, sharpest":L.layerGroup([new EsriSharp(ESRI,{attribution:credit}),nameLayer()]),
    "Satellite, Clarity (clearer colours)":L.layerGroup([new EsriSharp(CLARITY,{attribution:credit+" (Clarity)"}),nameLayer()]),
    "Street map (shows villages)":L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:MAXZ,maxNativeZoom:19,attribution:"&copy; OpenStreetMap contributors"})};
  let base="Satellite, sharpest"; try{ const b=localStorage.getItem("mapBase"); if(BASES[b]) base=b; }catch(e){}
  BASES[base].addTo(map);
  map.on("baselayerchange",e=>{ try{ localStorage.setItem("mapBase",e.name); }catch(x){} });
  L.control.layers(BASES,null,{position:"topright"}).addTo(map);
  L.control.scale({imperial:false}).addTo(map);
  const rend=L.canvas({tolerance:12,padding:0.4});
  const all=[];
  for(const c of CANALS){
    const ll=c.lines.map(l=>l.map(p=>[p[1],p[0]])); for(const l of ll) for(const p of l) all.push(p);
    const halo=L.polyline(ll,{renderer:rend,interactive:false}).addTo(map);
    const line=L.polyline(ll,{renderer:rend}).addTo(map);
    line.on("click",e=>{ L.DomEvent.stop(e); openSheet(c.id); });
    const longest=ll.reduce((x,z)=>z.length>x.length?z:x);
    LY.set(c.id,{halo,line,key:-1,tip:null,ll,on:true,bb:L.latLngBounds(ll.flat()),mid:longest[Math.floor(longest.length/2)]});
  }
  map.on("zoomend",drawMap); map.on("moveend",drawLabels);
  bounds=L.latLngBounds(all); map.setView(bounds.getCenter(),11); V.fitted=false;
  const Loc=L.Control.extend({options:{position:"topleft"},onAdd(){ const b=L.DomUtil.create("button","locbtn"); b.type="button"; b.textContent="◎"; b.title="Show my location"; b.setAttribute("aria-label","Show my location");
    L.DomEvent.disableClickPropagation(b); b.onclick=()=>map.locate({setView:true,maxZoom:18}); return b; }});
  map.addControl(new Loc());
  /* hide the drawn lines to see the canal itself; open the same spot in Google Maps satellite */
  const Tools=L.Control.extend({options:{position:"topleft"},onAdd(){ const d=L.DomUtil.create("div","mbtns");
    const hide=L.DomUtil.create("button","mbtn",d); hide.type="button"; hide.textContent="Hide lines"; hide.setAttribute("aria-pressed","false"); hide.title="Hide the drawn canal lines to see the canal on the ground";
    hide.onclick=()=>{ const off=!$("map").classList.contains("lines-off"); $("map").classList.toggle("lines-off",off); hide.textContent=off?"Show lines":"Hide lines"; hide.setAttribute("aria-pressed",off); };
    const g=L.DomUtil.create("button","mbtn",d); g.type="button"; g.textContent="Google"; g.title="Open this spot in Google Maps satellite view";
    g.onclick=()=>{ const c=map.getCenter(); window.open("https://www.google.com/maps/@?api=1&map_action=map&basemap=satellite&center="+c.lat.toFixed(6)+","+c.lng.toFixed(6)+"&zoom="+Math.min(21,Math.round(map.getZoom())),"_blank","noopener"); };
    L.DomEvent.disableClickPropagation(d); return d; }});
  map.addControl(new Tools());
  let me=null; map.on("locationfound",e=>{ if(me) me.remove(); me=L.circleMarker(e.latlng,{radius:8,color:"#fff",weight:2,fillColor:"#ff3b30",fillOpacity:1}).addTo(map); });
  map.on("locationerror",()=>setNote("Your location could not be read. Allow location access for this site and try again."));
}
/* map filters: V.grp = canal group shown ("" = all), V.run = running only, V.hl = canals found by map search */
V.grp=""; V.run=false; V.hl=new Set();
const LABEL_ZOOM=14;
const shortName=c=>{ const s=c.label.replace(/^(Takari Main Canal|Sonsal LBC)\//,"").split("/"); return s.length>2?s.slice(-2).join("/"):s.join("/"); };
const visible=(c,o)=>(!V.grp||c.grp===V.grp)&&(!V.run||o);
function drawMap(){
  if(!map) return; let shown=0,run=0; const close=map.getZoom()>=17;
  for(const c of CANALS){ const y=LY.get(c.id), o=!!openPeriod(P(c.id)), hl=V.hl.has(c.id), sel=S.sel===c.id||hl, v=visible(c,o);
    if(v!==y.on){ y.on=v; y.key=-1;
      if(v){ y.halo.addTo(map); y.line.addTo(map); }
      else{ y.halo.remove(); y.line.remove(); if(y.tip){ y.tip.remove(); y.tip=null; } } }
    if(!v) continue; shown++; if(o) run++;
    const key=(o?1:0)+(sel?2:0)+(hl?4:0)+(close?8:0); if(y.key===key) continue; y.key=key;
    if(close){ /* zoomed in close: thin see-through outline so the canal on the ground shows */
      y.halo.setStyle({color:sel?"#ffd400":"#001018",weight:sel?6:3.5,opacity:sel?.9:.35});
      y.line.setStyle({color:o?"#38b8ff":(c.dead?"#cfd6d6":"#ffffff"),weight:o?2.5:1.5,opacity:.85,dashArray:c.dead&&!o?"4 6":null});
    }else{
    y.halo.setStyle({color:sel?"#ffd400":"#001018",weight:(o?c.w+7:c.w+3.5)+(hl?3:0),opacity:sel?1:(o?.75:.55)});
    y.line.setStyle({color:o?"#38b8ff":(c.dead?"#cfd6d6":"#ffffff"),weight:o?c.w+3:c.w+1,opacity:1,dashArray:c.dead&&!o?"4 6":null}); }
    if(o||sel){ y.halo.bringToFront(); y.line.bringToFront(); }
    if(y.tip){ y.tip.remove(); y.tip=null; }
    if(o||hl) y.tip=L.tooltip({permanent:true,direction:"right",className:"ctip"+(hl?" hl":""),opacity:1,interactive:false}).setLatLng(y.mid).setContent(esc(c.label.replace(/^Takari Main Canal\//,""))).addTo(map);
  }
  if(!V.msg) setCount(shown,run);
  drawLabels();
}
function setCount(shown,run){ const el=$("mcount"); el.classList.remove("miss");
  if(V.run&&!run){ el.textContent="No canal"+(V.grp?" in "+V.grp:"")+" is running right now."; return; }
  el.textContent="Showing "+shown+" of "+CANALS.length+" canals · "+run+" running"+(map&&map.getZoom()<LABEL_ZOOM?" · zoom in to see every canal's name":""); }
/* names for every canal in view once zoomed in close */
const LB=new Map();
function drawLabels(){
  if(!map) return; const z=map.getZoom(), vb=map.getBounds().pad(0.1);
  for(const c of CANALS){ const y=LY.get(c.id), t=LB.get(c.id), want=z>=LABEL_ZOOM&&y.on&&!y.tip&&vb.intersects(y.bb);
    if(want&&!t) LB.set(c.id,L.tooltip({permanent:true,direction:"center",className:"ctip dim",opacity:1,interactive:false}).setLatLng(y.mid).setContent(esc(shortName(c))).addTo(map));
    else if(!want&&t){ t.remove(); LB.delete(c.id); } }
  if(!V.msg){ let s=0,r=0; for(const c of CANALS){ if(LY.get(c.id).on){ s++; if(openPeriod(P(c.id))) r++; } } setCount(s,r); }
}
/* find a canal: "dy24", "D.Y. No. 24" and "DY-24" all match */
const norm=s=>String(s||"").toLowerCase().replace(/[\s.\-_()]/g,"").replace(/no(?=\d)/g,"");
/* search keys: the clean label without "(part n)", its pieces, and the KMZ name as a fallback */
for(const c of CANALS){ const l=c.label.replace(/ \(part \d+\)$/,""); c.nk=norm(l); c.lsegs=l.split("/").map(norm); c.nseg=c.name.split("/").map(norm); c.rk=norm(c.name)+norm(c.remark); }
/* a system name in the query ("sonsal dy 9", "chinchani dy-5") limits the search to that system */
const SYS=[[/dudhari/i,"Takari-Dudhari Pipeline"],[/sonsal|shirasgaon|\blbc\b/i,"Sonsal Left Bank Canal"],[/chinchani|ambak|feeder/i,"Chinchani Feeder Canal"],
  [/mohite|vadgaon|vitarika/i,"Mohite-Vadgaon Vitarika"],[/takari|main canal/i,"Takari Main Canal"]];
function findCanals(q){
  let pool=CANALS, t=String(q||"");
  for(const [re,g] of SYS) if(re.test(t)){ const rest=t.replace(new RegExp(re.source,"gi"),"").replace(/\b(lbc|pdn|canal|pipeline)\b/gi,"");
    if(norm(rest)){ pool=CANALS.filter(c=>c.grp===g); t=rest; } break; }
  const n=norm(t); if(!n) return [];
  const pick=f=>pool.filter(f);
  let r=pick(c=>c.nk===n); if(r.length) return r;
  r=pick(c=>c.lsegs[c.lsegs.length-1]===n); if(r.length) return r;
  r=pick(c=>c.lsegs.includes(n)||c.nseg.includes(n)); if(r.length) return r;
  return pick(c=>c.nk.includes(n)||c.rk.includes(n));
}
function flashMsg(t,miss){ const el=$("mcount"); V.msg=true; el.textContent=t; el.classList.toggle("miss",!!miss); }
function goToCanals(list){
  if(!map) return;
  if(!list.length){ V.hl=new Set(); drawMap(); return flashMsg("No canal matches “"+$("mq").value.trim()+"”. Try a number like DY-24 or Minor-3L.",true); }
  if(list.length>25){ return flashMsg(list.length+" canals match. Type a bit more, e.g. DY-24/Minor-1.",true); }
  if(list.some(c=>!visible(c,!!openPeriod(P(c.id))))){ V.grp=""; V.run=false; $("mgrp").value=""; $("mrun").setAttribute("aria-pressed","false"); }
  V.hl=new Set(list.map(c=>c.id)); V.msg=false; drawMap();
  const bb=L.latLngBounds(list.flatMap(c=>LY.get(c.id).ll.flat()));
  map.invalidateSize(); map.fitBounds(bb,{padding:[40,40],maxZoom:16});
  flashMsg(list.length===1?"Found "+list[0].label+". Tap the yellow line to open it.":"Found "+list.length+" canals, shown in yellow. Tap one to open it.");
}
function clearFind(){ if(!V.hl.size&&!V.msg) return; V.hl=new Set(); V.msg=false; drawMap(); }
$("mqlist").innerHTML=CANALS.map(c=>'<option value="'+esc(c.label)+'">').join("");
{ const n=new Map(); for(const c of CANALS) n.set(c.grp,(n.get(c.grp)||0)+1);
  $("mgrp").insertAdjacentHTML("beforeend",GORDER.filter(g=>n.has(g)).map(g=>'<option value="'+esc(g)+'">'+esc(g)+' ('+n.get(g)+')</option>').join("")); }
$("mform").addEventListener("submit",e=>{ e.preventDefault(); const v=$("mq").value;
  /* just a system name ("sonsal", "chinchani") picks that system, like the group menu */
  for(const [re,g] of SYS) if(re.test(v)){ if(!norm(v.replace(new RegExp(re.source,"gi"),"").replace(/\b(lbc|pdn|canal|pipeline)\b/gi,""))){ $("mgrp").value=g; $("mgrp").dispatchEvent(new Event("change")); return; } break; }
  goToCanals(findCanals(v)); });
$("mq").addEventListener("input",()=>{ const v=$("mq").value; if(!v.trim()) return clearFind();
  const exact=CANALS.filter(c=>c.label===v); if(exact.length) goToCanals(exact); });
$("mgrp").addEventListener("change",()=>{ V.grp=$("mgrp").value; V.hl=new Set(); V.msg=false; drawMap();
  if(!map) return; const g=CANALS.filter(c=>!V.grp||c.grp===V.grp);
  map.fitBounds(V.grp?L.latLngBounds(g.flatMap(c=>LY.get(c.id).ll.flat())):bounds,{padding:[12,12]}); });
$("mrun").addEventListener("click",()=>{ V.run=!V.run; $("mrun").setAttribute("aria-pressed",V.run); V.msg=false; drawMap(); });
$("mfit").addEventListener("click",()=>{ V.grp=""; V.run=false; $("mgrp").value=""; $("mrun").setAttribute("aria-pressed","false"); $("mq").value=""; V.hl=new Set(); V.msg=false; drawMap(); if(map) map.fitBounds(bounds,{padding:[12,12]}); });
function sizeMap(){ if(!map) return false; map.invalidateSize(); if(!V.fitted&&map.getSize().x>0){ map.fitBounds(bounds,{padding:[12,12]}); V.fitted=true; } return true; }
function showOnMap(id){ closeSheet(); location.hash="#map"; setTimeout(()=>{ if(!map) return; map.invalidateSize(); map.fitBounds(L.latLngBounds(LY.get(id).ll.flat()),{padding:[40,40],maxZoom:16}); S.sel=id; drawMap(); },60); }
$("sheet").addEventListener("click",e=>{ if(e.target.id==="showmap"&&S.sel) showOnMap(S.sel); });
/* ---------- downloads, copy and print ---------- */
const xdt=t=>{ const d=new Date(t), z=n=>String(n).padStart(2,"0"); return z(d.getDate())+"-"+z(d.getMonth()+1)+"-"+d.getFullYear()+" "+z(d.getHours())+":"+z(d.getMinutes()); };
function saveCsv(kind,head,rows){ const R=SUM, q=v=>{ v=v==null?"":String(v); return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const txt=[head,...rows].map(r=>r.map(q).join(",")).join("\r\n");
  const u=URL.createObjectURL(new Blob(["﻿"+txt],{type:"text/csv"})), l=document.createElement("a");
  l.href=u; l.download="takari-canals-"+kind+"-"+xdt(R.a).slice(0,10)+"-to-"+xdt(R.b-1).slice(0,10)+".csv"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
const meta=c=>[c.grp,c.label,c.name,icaOf(c)||"",c.info&&c.info.cca!=null?c.info.cca:"",c.info&&c.info.ch?c.info.ch:(c.off?kmCh(c.off):"")];
$("csvdl").addEventListener("click",()=>{ const R=SUM, out=[];
  for(const x of R.sys) for(const {c,list} of x.rows) for(const p of list){ const e=p.e==null?R.now:p.e, inn=Math.min(e,R.b)-Math.max(p.s,R.a);
    out.push([...meta(c),xdt(p.s),p.e==null?"still running":xdt(p.e),(inn/HOUR).toFixed(2),fmtRun(inn),p.s<R.a?"yes":""]); }
  saveCsv("openings",["System","Canal","Name in KMZ","ICA (ha)","CCA (ha)","Offtake chainage","Opened","Closed","Hours in period","Run time in period","Opened before period"],out); });
$("csvtot").addEventListener("click",()=>{ const R=SUM, out=[];
  for(const x of R.sys) for(const {c,r} of x.rows) out.push([...meta(c),r.runs,(r.ms/HOUR).toFixed(2),r.ms?fmtRun(r.ms):"",(icaOf(c)*r.ms/DAY).toFixed(1)]);
  saveCsv("totals",["System","Canal","Name in KMZ","ICA (ha)","CCA (ha)","Offtake chainage","Openings","Hours in period","Run time in period","ICA x days (ha-days)"],out); });
function printHead(){ const R=SUM; $("printhead").innerHTML='<h1>Takari Canal Running Report</h1><div>Krishna Koyna Lift Irrigation Scheme, Takari</div><div><b>Period:</b> '+esc(periodText(R))+' &nbsp; <b>Printed:</b> '+esc(fmtDT(Date.now()))+'</div>'; }
$("printbtn").addEventListener("click",()=>window.print());
window.addEventListener("beforeprint",()=>{ S.printAll=true; renderSummary(); printHead(); });
window.addEventListener("afterprint",()=>{ S.printAll=false; renderSummary(); });
/* ---------- views ---------- */
function view(){ const h=(location.hash||"").slice(1); return ["map","canals","summary"].includes(h)?h:"map"; }
function showView(){ const v=view(); for(const n of ["map","canals","summary"]) $("v-"+n).classList.toggle("on",n===v);
  document.querySelectorAll("nav a").forEach(a=>{ if(a.dataset.v===v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  if(v==="map"){ sizeMap(!V.fitted); drawMap(); } }
function renderAll(){ renderStats(); renderList(); renderSummary(); drawMap(); if(S.sel) renderSheet(); }
window.addEventListener("hashchange",showView);
$("q").addEventListener("input",renderList);
document.querySelectorAll(".chip[data-f]").forEach(b=>b.addEventListener("click",()=>{ S.filter=b.dataset.f; document.querySelectorAll(".chip[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b)); renderList(); }));
$("rng").addEventListener("change",()=>{ $("dates").hidden=$("rng").value!=="custom"; renderSummary(); });
$("d1").addEventListener("change",renderSummary); $("d2").addEventListener("change",renderSummary);
$("showall").addEventListener("click",()=>{ S.showAll=!S.showAll; $("showall").setAttribute("aria-pressed",S.showAll); $("showall").textContent=S.showAll?"Hide canals that did not run":"Show canals that did not run"; renderSummary(); });
/* close the Download menu after a choice */
document.querySelectorAll(".dl .menu button").forEach(b=>b.addEventListener("click",()=>b.closest("details").open=false));
$("copy").addEventListener("click",async()=>{ const R=SUM; let txt="Takari canal running summary, "+periodText(R)+"\n";
  txt+="Canals ran "+R.ran+", ICA "+fmtHa(R.ica)+" ha, water flowing "+(R.ms?fmtRun(R.ms):"0")+", openings "+R.opens+"\n";
  for(const x of R.sys){ if(!x.rows.length) continue; txt+="\n"+x.g+" ("+(x.ran?x.ran+" canals, "+fmtHa(x.ica)+" ha, "+fmtRun(x.ms):"did not run")+")\nCanal\tICA ha\tOpened -> Closed\tRun time\n";
    for(const {c,r,list} of x.rows) txt+=c.short+"\t"+(icaOf(c)||"")+"\t"+(list.map(p=>fmtDT(p.s)+" -> "+(p.e==null?"still running":fmtDT(p.e))).join("; ")||"did not run")+"\t"+(r.ms?fmtRun(r.ms):"")+"\n"; }
  try{ await navigator.clipboard.writeText(txt); $("copymsg").textContent="Copied. Paste it into Excel or a message."; }
  catch(e){ const ta=$("csv"); ta.hidden=false; ta.value=txt; ta.select(); $("copymsg").textContent="Select and copy the text below."; } });

initMap(); showView(); renderAll(); connect();
setInterval(()=>{ if(!document.hidden&&!S.sel){ renderStats(); renderList(); } },60000);
</script>
